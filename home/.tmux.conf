# True color
set -g default-terminal "tmux-256color"
set -s terminal-overrides "xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Shell
set -g default-shell "$SHELL"

# Windows and panes start at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
set -g display-time 4000
set -g allow-passthrough on

# Mouse
set -g mouse on
set -g set-clipboard on
bind -T root MouseDown1StatusRight lock-session

# Copy mode — OSC52 via set-clipboard handles system clipboard automatically
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDown1Pane send -X clear-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Quick switch to last window
bind a last-window

# Reload
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Screensaver
bind S lock-session

# Status bar & Popups
set -g popup-border-lines rounded
set -g status-position bottom
set -g status on
set -gu status-format
set -g pane-border-lines single
set -g pane-border-status bottom
set -g pane-border-format ''
set-hook -gu client-focus-in
set-hook -gu client-focus-out
set -g status-interval 1
set -g status-left-length 50
set -g status-right-length 120
set -g window-status-separator " "
set -g window-status-bell-style "fg=colour234,bg=colour208,bold"
set -g monitor-bell on
set -g visual-bell off

# Copilot "unread" tab highlight: copilot-state.sh flags @copilot_unread on a
# window when a response/question arrives while you're elsewhere; clear it the
# instant you focus (view) that window so only genuinely-unseen tabs stay amber.
set-hook -g pane-focus-in 'set -wu @copilot_unread'

# Over SSH (e.g. a codespace) Copilot's hooks run on the remote host and can't
# reach this tmux server, so @copilot_state stays unset there. Instead the
# remote copilot-state.sh rings the terminal bell on turn handover; that BEL
# travels back over SSH and the monitor-bell + window-status-bell-style rules
# above flash the tab, cleared when you focus (pane-focus-in) the window.

# Theme: light or dark. Resolve via ~/.tmux/theme.sh (explicit DOTS_THEME >
# COLORFGBG > macOS appearance > dark) rather than trusting an inherited
# $DOTS_THEME: on a tmux-continuum/boot restore the server can start with no
# DOTS_THEME in its environment, which silently fell back to the dark theme even
# when everything else was light. Pin the resolved value into the server env so
# restored panes and the status scripts (battery.sh, donut, …) agree.
if-shell '[ "$(~/.tmux/theme.sh)" = light ]' {
    set-environment -g DOTS_THEME light
    set -g status-style "fg=#506888,bg=default"
    set -g status-left "#{?client_prefix,#[fg=#B46400]#[bg=#B46400]#[fg=#F6F0DE]#[bold] #S #[fg=#B46400]#[bg=default] ,#[fg=#1A8A72]#[bg=#1A8A72]#[fg=#F6F0DE]#[bold] #S #[fg=#1A8A72]#[bg=default] }"
    set -g status-right "#{?#{e|>=|:#{client_width},100},#(~/.tmux/network.sh)#(~/.tmux/battery.sh),}#{?#{e|>=|:#{client_width},80},#[fg=#808080]%a %d %b  ,}#(~/.tmux/heartbeat.sh)#[fg=#1A8A72]#[bg=#1A8A72]#[fg=#F6F0DE]#[bold] %H:%M #[fg=#1A8A72]#[bg=default]"
    set -g window-status-format "#{?#{@copilot_unread},#[fg=#B46400]#[bg=#B46400]#[fg=#F6F0DE]#[bold] #I #W ● #[fg=#B46400]#[bg=default],#[fg=#E0D8C0]#[bg=#E0D8C0]#[fg=#506888] #I #W#{?#{==:#{@copilot_state},working}, #[fg=#B46400]◐,}#{?#{==:#{@copilot_state},waiting}, #[fg=#1A8A72]●,}#{?#{==:#{@copilot_state},question}, #[fg=#806000]?,}#{?#{==:#{@copilot_state},error}, #[fg=#C00000]✗,} #[fg=#E0D8C0]#[bg=default]}"
    set -g window-status-current-format "#[fg=#1A8A72]#[bg=#1A8A72]#[fg=#E8E0CC]#[bold] #I #W#{?#{==:#{@copilot_state},working}, #[fg=#E8E0CC]◐,}#{?#{==:#{@copilot_state},waiting}, #[fg=#E8E0CC]●,}#{?#{==:#{@copilot_state},question}, #[fg=#E8E0CC]?,}#{?#{==:#{@copilot_state},error}, #[fg=#C00000]✗,} #[fg=#1A8A72]#[bg=default]"
    set -g window-status-style "fg=#506888,bg=default"
    set -g window-status-current-style "fg=#E8E0CC,bg=default,bold"
    set -g pane-border-style "fg=#E0D8C0"
    set -g pane-active-border-style "fg=#808080"
    set -g message-style "fg=#1A8A72,bg=#E0D8C0,fill=#E0D8C0"
    set -g message-command-style "fg=#B46400,bg=#E0D8C0,fill=#E0D8C0"
    set -g mode-style "fg=#3C4A50,bg=#C0D8CC,bold"
    set -g display-panes-colour "#808080"
    set -g display-panes-active-colour "#1A8A72"
    set -g clock-mode-colour "#1A8A72"
    set -g popup-border-style "fg=#1A8A72"
    set -g popup-style "bg=#F6F0DE,fg=#3C4A50"
} {
    set-environment -g DOTS_THEME dark
    set -g status-style "fg=#7290B8,bg=default"
    set -g status-left "#{?client_prefix,#[fg=colour208]#[bg=colour208]#[fg=#0A0A0A]#[bold] #S #[fg=colour208]#[bg=default] ,#[fg=#2CB494]#[bg=#2CB494]#[fg=#0A0A0A]#[bold] #S #[fg=#2CB494]#[bg=default] }"
    set -g status-right "#{?#{e|>=|:#{client_width},100},#(~/.tmux/network.sh)#(~/.tmux/battery.sh),}#{?#{e|>=|:#{client_width},80},#[fg=#808080]%a %d %b  ,}#(~/.tmux/heartbeat.sh)#[fg=#2CB494]#[bg=#2CB494]#[fg=#0A0A0A]#[bold] %H:%M #[fg=#2CB494]#[bg=default]"
    set -g window-status-format "#{?#{@copilot_unread},#[fg=#F88C14]#[bg=#F88C14]#[fg=#1A1A1A]#[bold] #I #W ● #[fg=#F88C14]#[bg=default],#[fg=#1A1A1A]#[bg=#1A1A1A]#[fg=#808080] #I #W#{?#{==:#{@copilot_state},working}, #[fg=#F88C14]◐,}#{?#{==:#{@copilot_state},waiting}, #[fg=#2CB494]●,}#{?#{==:#{@copilot_state},question}, #[fg=#FCFC38]?,}#{?#{==:#{@copilot_state},error}, #[fg=#F40404]✗,} #[fg=#1A1A1A]#[bg=default]}"
    set -g window-status-current-format "#[fg=#2CB494]#[bg=#2CB494]#[fg=#0A0A0A]#[bold] #I #W#{?#{==:#{@copilot_state},working}, #[fg=#0A0A0A]◐,}#{?#{==:#{@copilot_state},waiting}, #[fg=#0A0A0A]●,}#{?#{==:#{@copilot_state},question}, #[fg=#0A0A0A]?,}#{?#{==:#{@copilot_state},error}, #[fg=#F40404]✗,} #[fg=#2CB494]#[bg=default]"
    set -g window-status-style "fg=#808080,bg=default"
    set -g window-status-current-style "fg=#0A0A0A,bg=default,bold"
    set -g pane-border-style "fg=#222222"
    set -g pane-active-border-style "fg=#3A3A3A"
    set -g message-style "fg=#2CB494,bg=#1A1A1A,fill=#1A1A1A"
    set -g message-command-style "fg=#F88C14,bg=#1A1A1A,fill=#1A1A1A"
    set -g mode-style "fg=colour255,bg=colour30,bold"
    set -g display-panes-colour "#808080"
    set -g display-panes-active-colour "#2CB494"
    set -g clock-mode-colour "#2CB494"
    set -g popup-border-style "fg=#2CB494"
    set -g popup-style "bg=#121212,fg=#CCE0D0"
}

# Screensaver
set -g lock-after-time 300
set -g lock-command 'state="${XDG_RUNTIME_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/tmux}/heartbeat"; active_total=$(sed -n "s/^active_total=\([0-9][0-9]*\)$/\1/p" "$state" | head -n 1); ~/.tmux/donut "${active_total:-0}"'
set -g automatic-rename on
set -g allow-rename off
set -g automatic-rename-format '#{=/15/…:#{b:pane_current_path}}'

# Plugins (TPM) — cloned into ~/.tmux/plugins by install.d/24-tmux.sh
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence. Manual: prefix + C-s (save), prefix + C-r (restore).
# Keep save files out of the stow-folded ~/.tmux tree.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialise TPM — keep this line last
run '~/.tmux/plugins/tpm/tpm'
